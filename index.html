<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoping App  | E-Commerce Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <nav>
        <div class="logo" onclick="navigateTo('home')">ModernShop</div>
        <ul class="nav-links">
            <li><a onclick="navigateTo('home')">Home</a></li>
            <li><a onclick="navigateTo('shop')">Shop</a></li>
            <li><a onclick="navigateTo('contact')">Contact</a></li>
        </ul>
        <div class="cart-icon" onclick="navigateTo('cart')">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </div>
    </nav>


    <div id="home" class="page-section active">
        <div class="hero">
            <div>
                <h1>Summer Collection 2023</h1>
                <p>Discover the latest trends in fashion and electronics.</p>
                <br>
                <button class="btn" onclick="navigateTo('shop')">Shop Now</button>
            </div>
        </div>
        <h2>Featured Products</h2>
        <br>
        <div class="product-grid" id="featured-products">

        </div>
    </div>



    <div id="shop" class="page-section">
        <h2>All Products</h2>
        <br>
        <div class="product-grid" id="all-products">

        </div>
    </div>




    <div id="cart" class="page-section">
        <h2>Your Shopping Cart</h2>
        <br>
        <div class="cart-container">
            <div id="cart-items">
                <p>Your cart is empty.</p>
            </div>
            <div class="cart-total">
                Total: $<span id="cart-total">0.00</span>
            </div>
            <br>
            <button class="btn" onclick="alert('Checkout functionality coming soon!')">Proceed to Checkout</button>
        </div>
    </div>




    <div id="contact" class="page-section">
        <h2>Contact Us</h2>
        <br>
        <div class="contact-form">
            <form onsubmit="event.preventDefault(); alert('Message sent!');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>



    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" style="width:100%; height:200px; object-fit:cover; border-radius:4px; margin-bottom:1rem;">
            <h2 id="modal-title"></h2>
            <p id="modal-desc" style="margin: 1rem 0; color: #666;"></p>
            <h3 id="modal-price" style="color: var(--primary); margin-bottom: 1rem;"></h3>
            <button class="btn" id="modal-add-btn">Add to Cart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
